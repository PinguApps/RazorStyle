name: Publish NuGet Packages

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Resolve package version
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}"
          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }

          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore PinguApps.RazorStyle.slnx

      - name: Build
        run: dotnet build PinguApps.RazorStyle.slnx -c Release --no-restore

      - name: Pack
        run: dotnet pack PinguApps.RazorStyle.slnx -c Release --no-build -p:Version=${{ env.PACKAGE_VERSION }} -o artifacts/packages

      - name: Publish
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
